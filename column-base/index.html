<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柱脚计算工作台 · 可视化设计</title><meta name="description" content="柱脚参数实时可视化：底板、锚栓、加劲肋、抗剪键与逐项验算。"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="vendor/katex/katex-inline.css"></head><body class="workbench">
<header class="app-header"><a class="work-brand" href="#basic"><span class="brand-mark">⌑</span><span>柱脚计算工作台<small>COLUMN BASE LAB</small></span></a><div class="project-heading"><span class="eyebrow">箱形柱外露刚接</span><strong id="model-name">参数化节点</strong></div><div class="actions"><a class="button" href="../developing.html">← demo</a><span id="save-state" class="save-state">本地自动保存</span><button id="import-btn" class="button ghost">导入</button><button id="export-btn" class="button">保存参数</button><input id="import-file" type="file" accept=".json,application/json" hidden><a class="button primary" href="#report">计算书 ↗</a></div></header>
<main class="workbench-grid"><aside class="inspector" aria-label="参数输入"><div class="inspector-head"><div><span class="eyebrow">DESIGN INPUTS</span><h1>节点参数</h1></div><button class="button small ghost" id="calculate-btn" title="重新计算全部工况">重算 ↻</button></div><nav id="navigation" aria-label="参数分组"></nav><div class="preset-bar"><label for="preset-select">参考算例</label><select id="preset-select"><option value="">载入参考参数…</option><option value="example">BOX400 · 偏压 / H形键</option><option value="original">BOX300 · 轴压 / 十字键</option><option value="screen">原截图 · 肋距384</option></select></div><div id="inspector-scroll"><div id="input-content"></div><p class="inspector-foot">输入即更新 · 参数在当前浏览器保存</p></div></aside>
<section class="model-workspace" aria-label="节点可视化"><div class="viewport-toolbar"><div class="view-tabs" role="group" aria-label="模型视图"><button data-view="iso" class="active">轴测</button><button data-view="top">俯视</button><button data-view="front">正视 XZ</button><button data-view="side">侧视 YZ</button></div><div class="view-tools"><button id="pan-view" aria-pressed="false" title="平移：也可按住 Shift 拖动，或使用鼠标中键">平移</button><button id="toggle-dims" class="active" aria-pressed="true">尺寸</button><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit-view">适合窗口</button></div></div><div class="model-stage"><div class="stage-title"><div class="eyebrow">LIVE GEOMETRY <span class="live-dot">●</span></div><strong id="view-title">节点轴测</strong><span>尺寸单位 mm</span></div><div id="model-view" tabindex="0" aria-label="可旋转节点模型，点击尺寸定位输入；方向键旋转，滚轮缩放"></div><div id="active-property" class="active-property" aria-live="polite"></div><div class="stage-bottom"><div class="model-legend"><span style="--dot:#3e718b">底板 / 柱</span><span style="--dot:#ac7939">锚栓</span><span data-legend="rib" style="--dot:#74918b">加劲肋</span><span style="--dot:#537fc2">抗剪键</span></div><span class="gesture-hint">拖动旋转 · Shift拖动平移 · 滚轮缩放至800%</span></div></div><div id="load-deck" class="load-deck"></div><div class="model-footnote">箭头为底板 O 的换算后内力；启用高度后标记原作用点 P。柱显示长度、螺母及混凝土虚线边界仅为示意。</div><section id="document-panel" class="document-panel" hidden><div class="document-toolbar"><div><span class="eyebrow" id="step-indicator"></span><h2 id="page-title"></h2><p id="page-description"></p></div><button id="close-document" class="button">返回模型 ×</button></div><div id="page-content"></div></section></section>
<aside class="results-rail" aria-label="实时验算"><div class="rail-heading"><span class="eyebrow">LIVE CHECKS</span><a href="#results">全部结果 ↗</a></div><div id="global-error" role="alert"></div><div id="summary"></div><div class="rail-bottom"><a href="#method">计算方法与算例对照 ↗</a><p>各项结果按既有计算模型更新。适用范围与待复核项见计算书。</p></div></aside></main>
<dialog id="candidate-dialog"><div class="dialog-head"><div><span class="eyebrow">参数扫描</span><h2 id="candidate-title"></h2></div><button class="icon-button" id="close-dialog" aria-label="关闭">×</button></div><p id="candidate-note" class="muted"></p><div id="candidate-table"></div></dialog><div id="toast" role="status"></div><script src="engine.js"></script><script src="renderer.js"></script><script src="viewer.js"></script><script src="vendor/katex/katex.min.js"></script><script src="app.js"></script></body></html>
